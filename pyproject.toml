[project]
name = "equity-knowledge"
version = "0.1.0"
description = "Point-in-time knowledge system for NSE/BSE equity research"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",  # zoneinfo has no system tz database on Windows
    "python-dotenv>=1.0",  # .env also carries EQUITY_SOURCE_<NAME>_ENABLED switches
    "boto3>=1.40",  # S3-compatible blob storage (MinIO locally)
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: requires the Postgres test database (docker compose up -d db)",
    "blob: requires the object store (docker compose up -d --wait blob && docker compose run --rm blob-init)",
]
