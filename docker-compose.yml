# Single Postgres instance: Postgres 16 + pgvector (what every managed
# Postgres offers), plus object storage for raw source files, the one approved
# exception to "no new services" (CLAUDE.md Stack). Do not add services
# until measurements show this is inadequate.
#
# Shape mirrors the later cloud/Kubernetes deployment:
#   db        -> managed Postgres
#   blob      -> cloud blob storage (S3-compatible, or Azure behind core/blob.py)
#   migrate   -> one-shot Job / init container (`alembic upgrade head`)
#   blob-init -> one-shot bucket provisioning (done by infra-as-code in the cloud)
#   test      -> CI job
# The app image only ever sees EQUITY_* env vars (Secrets/ConfigMaps later).

x-app: &app
  build: .
  image: equity-knowledge:dev
  environment:
    EQUITY_DATABASE_URL: postgresql+psycopg://equity:equity_local_dev@db:5432/equity
    EQUITY_TEST_DATABASE_URL: postgresql+psycopg://equity:equity_local_dev@db:5432/equity_test
    EQUITY_BLOB_ENDPOINT_URL: http://blob:9000
  depends_on:
    db:
      condition: service_healthy
    blob-init:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: equity
      POSTGRES_PASSWORD: equity_local_dev  # local-only; port is bound to 127.0.0.1
      POSTGRES_DB: equity
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity -d equity"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO publishes its images nowhere we can read any more: it left Docker Hub
  # in 2025, then quay.io withdrew anonymous pulls of minio/* on 2026-09-24
  # (every tag, including latest, answers 401 -- the anonymous token is granted
  # but carries no actions). Both images are therefore mirrored into our own
  # Docker Hub namespace, which also keeps a third-party registry off the
  # critical path of every CI run. docs/minio-image-mirror.md covers how the
  # mirror was made and how to refresh it.
  #
  # Pinned by digest, because the write-once bucket design in core/blob.py
  # depends on the image being immutable. These digests are NOT the quay ones:
  # the mirror is a single linux/amd64 manifest, not quay's multi-arch index.
  # Same release either way: RELEASE.2025-09-07T16-13-09Z.
  # amd64 only -- an arm64 host needs the mirror re-pushed for its platform.
  blob:
    image: docker.io/maxh8086/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: equity
      MINIO_ROOT_PASSWORD: equity_local_dev  # local-only; port is bound to 127.0.0.1
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - blobdata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Buckets are write-once: object lock (which implies versioning) plus a
  # default GOVERNANCE retention, so stored source bytes cannot be deleted.
  # Wiping local blobs means removing the blobdata volume.
  blob-init:
    image: docker.io/maxh8086/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    depends_on:
      blob:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://blob:9000 equity equity_local_dev &&
        for b in equity-raw equity-raw-test; do
          mc mb --ignore-existing --with-lock local/$$b &&
          mc retention set --default GOVERNANCE 36500d local/$$b || exit 1;
        done
    restart: "no"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  test:
    <<: *app
    profiles: ["test"]
    command: ["python", "-m", "pytest", "-x", "--tb=short", "-p", "no:cacheprovider"]
    restart: "no"

volumes:
  pgdata:
  blobdata:
